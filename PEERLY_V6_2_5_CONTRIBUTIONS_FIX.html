<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PEERLY V6.1 ·  · Apprendre ensemble. Progresser ensemble.</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{--p:#5B5CE2;--pd:#4546B8;--s:#7C3AED;--bg:#F7F8FC;--sf:#fff;--tx:#171A24;--mu:#697080;--bd:#E7E9F0;--ok:#15803d;--okb:#E3F6EA;--wa:#B45309;--wab:#FDF0DC;--pl:#EEEEFD;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F111A;--sf:#181B27;--tx:#F1F2F8;--mu:#9AA0B4;--bd:#2A2E3F;--pl:#23244A;--okb:#12301E;--ok:#6EE7A0;--wab:#3A2A10;--wa:#F5B45A;--p:#8B8CF5}}
:root[data-theme="dark"]{--bg:#0F111A;--sf:#181B27;--tx:#F1F2F8;--mu:#9AA0B4;--bd:#2A2E3F;--pl:#23244A;--okb:#12301E;--ok:#6EE7A0;--wab:#3A2A10;--wa:#F5B45A;--p:#8B8CF5}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:500 15px/1.5 Manrope,system-ui,sans-serif}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.02em}h1{font-size:28px}h2{font-size:18px;margin:26px 0 10px}h3{font-size:16px}
button{font:inherit;cursor:pointer}a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--p);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--sf);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:6px;padding:10px 20px}
.logo{font-weight:800;font-size:20px;letter-spacing:-.03em;margin-right:14px;display:flex;align-items:center;gap:8px}
.mark{background:var(--p);color:#fff;border-radius:9px;width:30px;height:30px;display:grid;place-items:center;font-size:17px}
nav.top{display:flex;gap:2px;flex:1}nav a{padding:7px 12px;border-radius:9px;color:var(--mu);font-weight:600}
nav a.on{background:var(--pl);color:var(--p)}
.bell{position:relative;background:none;border:1px solid var(--bd);border-radius:10px;width:38px;height:38px;color:var(--tx)}
.dot{position:absolute;top:-5px;right:-5px;background:var(--p);color:#fff;border-radius:9px;font-size:11px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
main{max-width:920px;margin:0 auto;padding:22px 20px 100px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:16px}
.row{display:flex;gap:12px;align-items:center}.grow{flex:1;min-width:0}.mu{color:var(--mu);font-size:13px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}
.btn{background:var(--p);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:700;transition:transform .12s,background .12s}
.btn:hover{background:var(--pd)}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.o{background:var(--sf);color:var(--tx);border:1px solid var(--bd)}.btn.o:hover{background:var(--pl)}.btn.big{padding:20px;font-size:16px;text-align:left;border-radius:14px}
.btn.big.two{background:var(--sf);color:var(--tx);border:1px solid var(--bd)}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.tag{display:inline-block;background:var(--pl);color:var(--p);border-radius:8px;padding:2px 9px;font-size:12.5px;font-weight:700;margin:2px 4px 2px 0}
.tag.ok{background:var(--okb);color:var(--ok)}.tag.wa{background:var(--wab);color:var(--wa)}
.bar{height:7px;background:var(--bd);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--p)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:20px;padding:7px 14px;font-weight:600}
.chip.on{background:var(--p);border-color:var(--p);color:#fff}
.stat b{display:block;font-size:22px;font-weight:800}
.swap{display:flex;align-items:center;justify-content:center;gap:14px;font-weight:800;font-size:15px;background:var(--pl);border-radius:12px;padding:14px;color:var(--p)}
.modal{position:fixed;inset:0;background:rgba(10,12,25,.55);display:grid;place-items:center;z-index:20;padding:16px}
.modal .card{width:100%;max-width:420px;animation:pop .18s ease-out}@keyframes pop{from{transform:scale(.96);opacity:0}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:700;z-index:30;animation:pop .2s}
.msgs{display:flex;flex-direction:column;gap:8px;min-height:240px;max-height:340px;overflow:auto;padding:6px 0}
.bub{max-width:78%;padding:9px 13px;border-radius:14px;background:var(--pl)}.bub.me{align-self:flex-end;background:var(--p);color:#fff}
input,textarea{width:100%;font:inherit;background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
.tabbar{display:none}
.empty{text-align:center;padding:30px 10px;color:var(--mu)}
@media(max-width:720px){nav.top,.hide-m{display:none}.g2,.g4{grid-template-columns:1fr 1fr}.g2.stack{grid-template-columns:1fr}
.tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--sf);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
.tabbar a{flex:1;text-align:center;font-size:11.5px;font-weight:700;color:var(--mu);padding:4px}.tabbar a.on{color:var(--p)}.tabbar span{display:block;font-size:19px}
main{padding-bottom:110px}.toast{bottom:100px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="app"></div>
<script>
const COL=['#5B5CE2','#7C3AED','#0E8F7E','#D9730D','#C2410C','#2563EB'];
const SUBJ={Anglais:['TOEIC','Grammar','Vocabulary','Speaking'],Maths:['Algèbre','Probabilités','Analyse'],Réseaux:['VLAN','Routage','Cybersécurité'],Python:['Algorithmique','Pandas'],Physique:['Mécanique','Électricité']};
const ME={id:0,name:'Kérian',lvl:'Ingé 2',school:'EFREI Paris',teach:{Maths:5,Réseaux:4},learn:{Anglais:2,Physique:2}};
const P=[
{id:1,name:'Emma Martin',lvl:'Ingé 2 · Informatique',rating:4.9,n:18,grade:'Niveau 4 · Mentor étudiant',skills:{Anglais:5,Python:4,Maths:3},topics:['TOEIC','Grammar','Speaking','Algorithmique'],learn:['Réseaux','Cybersécurité'],slot:'Mardi 18h',fmt:'Visio',bio:"J'aime expliquer l'anglais et la programmation, toujours avec des exemples concrets.",rev:['Explications très claires.','Très sympa et ponctuelle.','Elle m’a vraiment aidé à comprendre.']},
{id:2,name:'Lucas Bernard',lvl:'Ingé 1',rating:4.8,n:12,grade:'Niveau 3 · Aidant régulier',skills:{Anglais:4,Physique:3},topics:['Grammar','Vocabulary'],learn:['Maths','Réseaux'],slot:'Mardi 19h',fmt:'Message',bio:"Bilingue par ma mère, je peux t'aider à parler sans stress.",rev:['Patient et drôle.','Super pour la grammaire.']},
{id:3,name:'Sofia Benali',lvl:'Bac+3 · Gestion',rating:4.7,n:9,grade:'Niveau 3 · Aidant régulier',skills:{Anglais:5,Physique:4},topics:['TOEIC','Vocabulary','Mécanique','Électricité'],learn:['Maths','Réseaux'],slot:'Jeudi 17h',fmt:'Visio',bio:"Je prépare le TOEIC depuis 2 ans. Je cherche quelqu'un de solide en maths.",rev:['Très pédagogue.']},
{id:4,name:'Thomas Leroy',lvl:'Ingé 1 · Informatique',rating:4.6,n:5,grade:'Niveau 2 · Contributeur',skills:{Réseaux:3,Python:5},topics:['Algorithmique','Pandas'],learn:['Anglais','Maths'],slot:'Mercredi 18h',fmt:'Message',bio:"Passionné de code, je débute en réseaux et j'ai du mal avec l'anglais.",rev:['Clair et efficace.']}];
const REQ=[{id:184,who:'Camille R.',lvl:'Ingé 1',subj:'Réseaux',t:"Je cherche quelqu'un pour m'aider avec les VLAN.",fmt:'Visio',d:'1h',slot:'Mardi 18h'},{id:185,who:'Hugo P.',lvl:'Bac+2',subj:'Maths',t:'Probabilités : je bloque sur les lois conditionnelles.',fmt:'Message',d:'30 min',slot:'Mercredi 17h'},{id:186,who:'Inès D.',lvl:'Bac+1',subj:'Python',t:'Besoin d’aide sur les boucles et les listes.',fmt:'Visio',d:'1h',slot:'Jeudi 18h'}];
const S={sessions:[{id:1,subj:'Anglais',with:'Emma',slot:'Mardi 29 · 18:00',d:'60 min',fmt:'Visio',st:'accepted',role:'learn',c:15},{id:2,subj:'Réseaux',with:'Lucas',slot:'Mardi 29 · 20:00',d:'30 min',fmt:'Message',st:'accepted',role:'help',c:10}],
notifs:[{i:'🟢',t:'Emma a accepté ta demande.',u:1},{i:'🟠',t:'Ta session d’anglais commence bientôt.',u:1},{i:'⭐',t:'Nouvel avis : « Très clair sur les VLAN ».',u:0}],
credits:128,hist:[['+20','Session Python'],['-15','Session Anglais'],['+10','Réponse communautaire']],done:17,
msgs:{1:[['o','Salut Kérian ! Prêt pour mardi ?']],2:[['o','Merci pour ton aide en réseaux 🙏']],3:[]},chat:1,help:{subj:'Anglais',topic:null,fmt:'Visio'},showN:false,toast:null};
const $=id=>document.getElementById(id);
const col=i=>COL[i%COL.length];
const av=(n,i,s=44)=>`<div style="position:relative;flex:none"><div class="av" style="background:${col(i)};width:${s}px;height:${s}px" role="img" aria-label="Avatar de ${n}">${n[0]}</div>${i>0&&typeof dot=="function"?dot(i,s):""}</div>`;
const route=()=>location.hash.slice(2)||'home';
function score(p,subj,topic){const l=p.skills[subj]||0;if(!l)return 0;return l*10+(topic&&p.topics.includes(topic)?20:0)+p.rating*4+(Object.keys(ME.teach).some(k=>p.learn.includes(k))?12:0)}
const label=s=>s>=85?['Très compatible','ok']:s>=60?['Compatible','']:['Pertinent','wa'];
function toast(m){S.toast=m;render();setTimeout(()=>{S.toast=null;render()},2200)}
function notif(i,t){S.notifs.unshift({i,t,u:1})}
function go(r){location.hash='/'+r}
function nav(){const r=route().split('/')[0],L=[['home','Accueil','🏠'],['explore','Explorer','🔍'],['helpers','Aider','🤝'],['calendar','Calendrier','📅'],['sessions','Sessions','🗂'],['groups','Groupes','👥'],['messages','Messages','💬'],['credits','Crédits','🪙']];
const un=S.notifs.filter(n=>n.u).length;
return `<header><a class="logo" href="#/home" aria-label="PEERLY, accueil"><span class="mark">↔</span>PEERLY</a><nav class="top" aria-label="Navigation principale">${L.map(l=>`<a href="#/${l[0]}" class="${r==l[0]?'on':''}">${l[1]}</a>`).join('')}</nav><span class="grow hide-m"></span><button class="bell" onclick="S.showN=!S.showN;S.notifs.forEach(n=>n.u=0);render()" aria-label="Notifications">🔔${un?`<span class="dot">${un}</span>`:''}</button><a href="#/profile/me" class="row" aria-label="Mon profil">${av('K',0,38)}</a></header>
${S.showN?`<div class="card" style="position:fixed;right:16px;top:64px;z-index:9;width:min(340px,92vw)"><h3>Notifications</h3>${S.notifs.map(n=>`<p style="margin:10px 0;cursor:pointer" class="row" onclick="S.showN=false;go('${n.r||'sessions'}')"><span>${n.i}</span><span>${n.t}</span></p>`).join('')}</div>`:''}
<nav class="tabbar" aria-label="Navigation mobile">${[['home','Accueil','🏠'],['explore','Explorer','🔍'],['help','Aide','＋'],['sessions','Sessions','📅'],['profile/me','Profil','👤']].map(l=>`<a href="#/${l[0]}" class="${r==l[0].split('/')[0]?'on':''}"><span>${l[2]}</span>${l[1]}</a>`).join('')}</nav>`}
function stars(n){return '★'.repeat(n)+'☆'.repeat(5-n)}
function pcard(p,subj,topic){const [lb,c]=label(score(p,subj,topic));const mutual=p.learn.some(k=>ME.teach[k])&&Object.keys(ME.learn).some(k=>p.skills[k]>=4);
return `<div class="card"><div class="row">${av(p.name,p.id)}<div class="grow"><h3>${p.name}</h3><div class="mu">${p.lvl} · ★ ${p.rating} · ${p.n} sessions</div></div><span class="tag ${c}">${lb}</span></div>
<p style="margin:10px 0 4px">${p.topics.slice(0,3).map(t=>`<span class="tag">${t}</span>`).join('')}${mutual?'<span class="tag ok">↔ Entraide possible</span>':''}</p>
<div class="mu">Disponible : ${p.slot} · ${p.fmt}</div><div class="row" style="margin-top:12px"><a class="btn o" href="#/profile/${p.id}">Voir le profil</a><button class="btn" onclick="book(${p.id})">Réserver</button></div></div>`}
const V={
home(){const need=Object.keys(ME.learn)[0],c=P.filter(p=>p.skills[need]).length;
return `<h1>Bonjour Kérian 👋</h1><p class="mu">Que veux-tu faire ?</p>
<div class="grid g2 stack"><button class="btn big" onclick="go('help')">J'ai besoin d'aide<br><small style="font-weight:500;opacity:.85">Trouve la bonne personne en quelques clics</small></button><button class="btn big two" onclick="go('helpers')">Je peux aider<br><small class="mu">3 demandes correspondent à tes compétences</small></button></div>
<h2>Suggestions pour toi</h2><div class="grid">
<div class="card row"><span style="font-size:22px">↔</span><div class="grow"><b>Vous pourriez vous aider mutuellement</b><div class="mu">Sofia maîtrise l'anglais et cherche de l'aide en maths.</div></div><a class="btn o" href="#/mutual">Voir</a></div>
<div class="card row"><div class="grow"><b>${c} étudiants pourraient t'aider en ${need.toLowerCase()}.</b><div class="mu">2 étudiants cherchent quelqu'un en réseaux.</div></div><button class="btn o" onclick="S.help.subj='${need}';go('results')">Voir</button></div></div>
<h2>Tes prochaines sessions</h2>${sess(S.sessions.filter(s=>s.st=='accepted').slice(0,2))}
<h2>Ta progression</h2><div class="grid g4"><div class="card stat"><b>${S.credits} 🪙</b><span class="mu">crédits</span></div><div class="card stat"><b>Niveau 3</b><span class="mu">Aidant régulier</span></div><div class="card stat"><b>${S.done}</b><span class="mu">sessions</span></div><div class="card stat"><b>4,8 ★</b><span class="mu">moyenne</span></div></div>
<h2>Questions de la communauté</h2><div class="card"><b>Quelqu'un peut m'expliquer les VLAN ?</b><div class="mu">Réseaux · Ingé 1 · 4 réponses</div><span class="tag ok">Réponse acceptée</span></div>`},
help(){const h=S.help;return `<h1>De quelle aide as-tu besoin ?</h1><h2>Dans quelle matière ?</h2><div class="chips" role="group" aria-label="Matière">${Object.keys(SUBJ).map(s=>`<button class="chip ${h.subj==s?'on':''}" aria-pressed="${h.subj==s}" onclick="S.help.subj='${s}';S.help.topic=null;render()">${s}</button>`).join('')}</div>
<h2>Sur quel sujet ?</h2><div class="chips">${SUBJ[h.subj].map(t=>`<button class="chip ${h.topic==t?'on':''}" onclick="S.help.topic='${t}';render()">${t}</button>`).join('')}</div>
<h2>Quel format ?</h2><div class="chips">${['Message','Visio','Groupe','Peu importe'].map(f=>`<button class="chip ${h.fmt==f?'on':''}" onclick="S.help.fmt='${f}';render()">${f}</button>`).join('')}</div>
<p style="margin-top:26px"><button class="btn" onclick="go('results')">Trouver des profils compatibles</button></p>`},
results(){const h=S.help;const L=P.map(p=>({p,s:score(p,h.subj,h.topic)})).filter(x=>x.s).sort((a,b)=>b.s-a.s);
return `<h1>${L.length} profils pour « ${h.subj}${h.topic?' · '+h.topic:''} »</h1><p class="mu">Classés par compatibilité : matière, sujet, disponibilité et fiabilité.</p><div class="grid" style="margin-top:14px">${L.length?L.map(x=>pcard(x.p,h.subj,h.topic)).join(''):'<div class="card empty">Personne ne correspond pour l’instant.<br><button class="btn" onclick="go(\'help\')">Modifier ma demande</button></div>'}</div>`},
explore(){return V.results.call(0,S.help=S.help)},
profile(id){const p=id=='me'?null:P.find(x=>x.id==id);
if(!p)return `<div class="card"><div class="row">${av('Kérian',0,64)}<div><h1>Kérian</h1><div class="mu">Ingé 2 · EFREI Paris · Niveau 3 · Aidant régulier</div></div></div><h2>Ce que je maîtrise</h2>${Object.entries(ME.teach).map(([k,v])=>skill(k,v)).join('')}<h2>Ce que je veux apprendre</h2>${Object.keys(ME.learn).map(k=>`<span class="tag wa">${k}</span>`).join('')}<h2>Confidentialité</h2><p class="mu">Ton email et ton numéro ne sont jamais affichés. Les échanges passent par la messagerie PEERLY.</p></div>`;
return `<div class="card"><div class="row">${av(p.name,p.id,64)}<div><h1>${p.name}</h1><div class="mu">${p.lvl} · EFREI Paris</div><div><b>★ ${p.rating}</b> · ${p.n} sessions · ${p.grade}</div></div></div><p>« ${p.bio} »</p>
<h2>Compétences</h2>${Object.entries(p.skills).map(([k,v])=>skill(k,v)).join('')}<h2>Ce qu'elle·il peut enseigner</h2>${p.topics.map(t=>`<span class="tag">${t}</span>`).join('')}<h2>Veut apprendre</h2>${p.learn.map(t=>`<span class="tag wa">${t}</span>`).join('')}
<h2>Disponibilités</h2><p>${p.slot} · ${p.fmt}</p><h2>Avis</h2>${p.rev.map(r=>`<p class="card" style="margin:6px 0"><span style="color:#D9930D">★★★★★</span> ${r} <button class="mu" style="background:none;border:0" onclick="toast('Avis signalé à la modération')">Signaler</button></p>`).join('')}
<p class="row" style="margin-top:16px"><button class="btn" onclick="book(${p.id})">Réserver une session</button><button class="btn o" onclick="S.chat=${p.id>3?3:p.id};go('messages')">Envoyer un message</button></p></div>`},
mutual(){const p=P[2];return `<h1>Trouver quelqu'un avec qui progresser</h1><div class="card" style="margin-top:14px"><div class="row">${av(p.name,p.id)}<div class="grow"><h3>${p.name}</h3><div class="mu">${p.lvl}</div></div><span class="tag ok">Très compatible</span></div>
<div class="swap" style="margin:14px 0">Maths · Kérian → Sofia</div><div class="swap">Anglais · Sofia → Kérian</div><p class="mu">Vous pourriez vous aider mutuellement, sans dépenser de crédits : chacun aide l'autre.</p>
<button class="btn" onclick="S.sessions.unshift({id:Date.now(),subj:'Maths ↔ Anglais',with:'Sofia',slot:'Jeudi 17:00',d:'2 × 45 min',fmt:'Visio',st:'pending',role:'mutual',c:0});notif('🔵','Proposition d’entraide envoyée à Sofia.');toast('Entraide proposée à Sofia ✔');go('sessions')">Proposer une entraide</button></div>`},
helpers(){return `<h1>Tu peux aider quelqu'un.</h1><p class="mu">Demandes qui correspondent à tes compétences.</p><div class="grid" style="margin-top:14px">${REQ.filter(r=>!r.done).map(r=>`<div class="card"><div class="mu">Demande #${r.id} · ${r.who} · ${r.lvl}</div><h3 style="margin:4px 0">${r.t}</h3><span class="tag">${r.subj}</span><span class="tag">${r.fmt}</span><span class="tag">${r.d}</span><span class="tag">${r.slot}</span>
<p><span class="tag ${ME.teach[r.subj]?'ok':'wa'}">${ME.teach[r.subj]?'Tu maîtrises '+r.subj:'Hors de tes compétences'}</span></p><button class="btn" onclick="offer(${r.id})">Je peux aider</button></div>`).join('')||'<div class="card empty">Plus aucune demande pour le moment.<br>Reviens bientôt.</div>'}</div>`},
sessions(){return `<h1>Sessions</h1><p class="mu" style="margin:4px 0 14px">Les crédits sont transférés quand la session est validée.</p>${S.sessions.length?sess(S.sessions,true):'<div class="card empty">Tu n’as encore aucune session.<br><a class="btn" href="#/explore">Explorer</a></div>'}`},
messages(){const ids=[1,2,3],c=S.chat,p=P.find(x=>x.id==c);
return `<h1>Messages</h1><div class="chips" style="margin:12px 0">${ids.map(i=>`<button class="chip ${c==i?'on':''}" onclick="S.chat=${i};render()">${P.find(x=>x.id==i).name.split(' ')[0]}</button>`).join('')}</div>
<div class="card"><div class="row">${av(p.name,p.id,36)}<b class="grow">${p.name}</b><button class="btn o" onclick="book(${p.id})">Proposer une session</button></div><div class="msgs" aria-live="polite">${S.msgs[c].length?S.msgs[c].map(m=>`<div class="bub ${m[0]=='me'?'me':''}">${m[1]}</div>`).join(''):'<div class="empty">Dis bonjour 👋 Ton numéro reste privé.</div>'}</div>
<div class="row"><input id="mi" aria-label="Ton message" placeholder="Écris un message…" onkeydown="if(event.key=='Enter')send()"><button class="btn" onclick="send()">Envoyer</button></div><p class="mu"><button style="background:none;border:0;color:var(--mu)" onclick="toast('Conversation signalée')">Signaler</button> · <button style="background:none;border:0;color:var(--mu)" onclick="toast('Utilisateur bloqué')">Bloquer</button></p></div>`},

<h2>Grade : Niveau 3 · Aidant régulier</h2><div class="bar"><i style="width:${Math.min(100,S.done*4.5)}%"></i></div><p class="mu">Le grade dépend des sessions, des avis, de la régularité et du respect des règles, pas seulement des crédits.</p>`}};

function book(id){const p=P.find(x=>x.id==id);S.modal=`<h3>Réserver avec ${p.name}</h3><p class="mu">${S.help.subj} · ${p.slot} · ${p.fmt} · 60 min</p><p><b>Coût : 15 🪙</b><br><span class="mu">Solde : ${S.credits} 🪙${S.credits<15?' — insuffisant, aide quelqu’un pour en gagner':''}</span></p><div class="row"><button class="btn o" onclick="S.modal=null;render()">Annuler</button><button class="btn" ${S.credits<15?'disabled':''} onclick="confirmB(${id})">Confirmer</button></div>`;render()}
function confirmB(id){const p=P.find(x=>x.id==id);S.sessions.unshift({id:Date.now(),subj:S.help.subj,with:p.name.split(' ')[0],slot:p.slot.replace(' ',' · '),d:'60 min',fmt:p.fmt,st:'pending',role:'learn',c:15});S.modal=null;notif('🔵','Demande envoyée à '+p.name.split(' ')[0]+'.');toast('Demande envoyée ✔');setTimeout(()=>{const s=S.sessions.find(x=>x.st=='pending'&&x.with==p.name.split(' ')[0]);if(s){s.st='accepted';notif('🟢',p.name.split(' ')[0]+' a accepté ta demande.');toast(p.name.split(' ')[0]+' a accepté ✔')}},3500);go('sessions')}
function offer(id){const r=REQ.find(x=>x.id==id);r.done=1;S.sessions.unshift({id:Date.now(),subj:r.subj,with:r.who,slot:r.slot.replace(' ',' · '),d:r.d,fmt:r.fmt,st:'accepted',role:'help',c:15});notif('🟢','Session confirmée avec '+r.who+'.');toast('Proposition envoyée ✔');go('sessions')}

function cancelS(id){S.sessions.find(x=>x.id==id).st='cancelled';toast('Session annulée');render()}
function send(){const t=$('mi').value.trim();if(!t)return;const c=S.chat;S.msgs[c].push(['me',t]);render();setTimeout(()=>{S.msgs[c].push(['o','Ça marche, on en parle en session ! 😊']);notif('💬','Nouveau message de '+P.find(x=>x.id==c).name.split(' ')[0]);render()},1200)}
function render(){const r=route().split('/');const f=V[r[0]]||V.home;$('app').innerHTML=nav()+`<main>${f(r[1])}</main>`+(S.modal?`<div class="modal" role="dialog" aria-modal="true" onclick="if(event.target==this){S.modal=null;render()}"><div class="card">${S.modal}</div></div>`:'')+(S.toast?`<div class="toast" role="status">${S.toast}</div>`:'')}
addEventListener('hashchange',()=>{S.showN=false;render();scrollTo(0,0)});render();
</script><script>
/* ===== PEERLY V2 ===== */

inc:[{id:1,pid:2,k:'help',t:'Lucas souhaite travailler les VLAN.',subj:'Réseaux',slot:'Mardi 18h',fmt:'Visio'},{id:2,pid:2,k:'mutual',t:'Lucas souhaite proposer une entraide.',off:'Anglais',want:'Maths'}],
set:{msg:1,req:1,sess:1,rap:1,avis:1,d0:1,d1:1,d3:1,d4:1,d5:1}});

function book(id){const p=P.find(x=>x.id==id),w=S.w,n=p.name.split(' ')[0];S.modal=`<h3>Demander de l'aide à ${n}</h3><p class="mu">${w.subj}${w.topic?' · '+w.topic:''} · ${w.fmt} · ${w.dur} · ${w.flex?'créneaux flexibles':w.slots.join(', ')}</p><textarea id="bm" rows="3" aria-label="Message">Bonjour ${n}, j'aurais besoin d'aide en ${w.subj}…</textarea><p><b>Coût : ${CFG.cost} 🪙</b> <span class="mu">· solde ${S.credits}</span></p><div class="row"><button class="btn o" onclick="S.modal=null;render()">Annuler</button><button class="btn" ${S.credits<CFG.cost?'disabled':''} onclick="sendReq(${id},$('bm').value)">Envoyer la demande</button></div>`;render()}
function sendReq(pid,msg){const p=P.find(x=>x.id==pid),w=S.w,n=p.name.split(' ')[0],s={id:Date.now(),pid,subj:w.subj,with:n,slot:w.flex?p.slot:(w.slots[0]||p.slot),d:w.dur,fmt:w.fmt,st:'waiting',role:'learn',c:CFG.cost};S.sessions.unshift(s);(S.msgs[pid]=S.msgs[pid]||[]).push(['me',msg],['s','📅 Demande envoyée : '+s.subj+' · '+s.slot]);S.modal=null;notif('🔵','Demande envoyée à '+n+'.','sessions');toast('Demande envoyée ✔');

function inc(){return S.inc.map(r=>`<div class="card" style="margin-bottom:10px"><b>🔔 ${r.t}</b><div class="mu">${r.k=='help'?r.slot+' · '+r.fmt:'Il propose : '+r.off+' → il recherche : '+r.want}</div><div class="row" style="margin-top:8px;flex-wrap:wrap">${B(`incA(${r.id})`,'Accepter')}${B(`incR(${r.id})`,'Refuser',1)}${B(`incO(${r.id})`,r.k=='help'?'Autre créneau':'Autre fonctionnement',1)}</div></div>`).join('')}
function incA(id){const r=S.inc.find(x=>x.id==id);S.inc=S.inc.filter(x=>x!=r);if(r.k=='help'){S.sessions.unshift({id:Date.now(),pid:r.pid,subj:r.subj,with:'Lucas',slot:r.slot,d:'1h',fmt:r.fmt,st:'accepted',role:'help',c:CFG.earn});notif('🟢','Session confirmée avec Lucas.','calendar');toast('Session confirmée ✔');go('calendar')}else{S.rel={pid:r.pid,st:'active'};toast('Votre entraide est créée');go('mutual')}}

function altM(){S.modal=`<h3>Proposer un autre créneau</h3><div class="chips">${['Mercredi 18h','Jeudi 19h','Vendredi 17h'].map(x=>`<button class="chip ${S.alt.includes(x)?'on':''}" onclick="S.alt=S.alt.includes('${x}')?S.alt.filter(y=>y!='${x}'):[...S.alt,'${x}'];altM();render()">${x}</button>`).join('')}</div><textarea id="am" rows="2" aria-label="Message" placeholder="Message facultatif : je ne peux pas mardi, mais je suis disponible mercredi."></textarea><div class="row"><button class="btn o" onclick="S.modal=null;render()">Annuler</button><button class="btn" onclick="altS()">Envoyer une proposition</button></div>`}
function altS(){const r=S.inc.find(x=>x.id==S.altId);S.inc=S.inc.filter(x=>x!=r);S.modal=null;S.sessions.unshift({id:Date.now(),pid:r.pid,subj:r.subj||'Entraide',with:'Lucas',slot:S.alt[0]||'Mercredi 18h',d:'1h',fmt:r.fmt||'Visio',st:'waiting',role:'help',c:CFG.earn});notif('🟠','Proposition envoyée à Lucas.','sessions');toast('Proposition envoyée ✔');render()}
function finish(id){const s=S.sessions.find(x=>x.id==id);s.st='completed';S.done++;if(s.role=='help'){S.credits+=CFG.earn;S.hist.unshift(['+'+CFG.earn,'Session '+s.subj]);notif('🪙','Tu as gagné +'+CFG.earn+' crédits.','credits');toast('+'+CFG.earn+' 🪙 gagnés !')}else if(s.role=='learn'){S.credits-=s.c;S.hist.unshift(['-'+s.c,'Session '+s.subj]);toast('Session validée · -'+s.c+' 🪙')}else toast('Session terminée ✔');S.rv={sid:id,g:0,a:0,b:0,c:0,txt:''};S.modal=rvm();go('sessions');render()}
function rvm(){const r=S.rv,R=(k,l)=>`<div class="row"><span class="grow">${l}</span><span>${[1,2,3,4,5].map(n=>`<button style="background:none;border:0;font-size:22px;color:${r[k]>=n?'#D9930D':'var(--bd)'}" aria-label="${n} sur 5" onclick="S.rv.txt=$('rc').value;S.rv.${k}=${n};S.modal=rvm();render()">★</button>`).join('')}</span></div>`;return `<h3>Comment s'est passée cette session ?</h3>${R('g','Note globale')}${R('a','Clarté')}${R('b','Ponctualité')}${R('c','Communication')}<textarea id="rc" rows="3" aria-label="Commentaire" placeholder="Explique ton expérience…">${r.txt}</textarea><div class="row"><button class="btn o" onclick="S.modal=null;render()">Plus tard</button><button class="btn" onclick="pubRv()">Publier mon avis</button></div>`}
function pubRv(){const r=S.rv,s=S.sessions.find(x=>x.id==r.sid),p=P.find(x=>x.id==s.pid);if(p&&s.role!='help'){const n=r.g||5;p.rev.unshift($('rc').value||'Bonne session.');p.rating=+((p.rating*p.n+n)/(p.n+1)).toFixed(1);p.n++}S.modal=null;notif('⭐','Avis publié.',p?'profile/'+p.id:'profile/me');toast('Avis publié ✔');render()}
let iv;function tick(){clearInterval(iv);iv=setInterval(()=>{if(!S.call||!S.call.on)return clearInterval(iv);S.call.t++;const e=$('tm');if(e)e.textContent=mmss(S.call.t)},1000)}

function wz(k,x){const w=S.w;if(k=='slot')w.slots=w.slots.includes(x)?w.slots.filter(y=>y!=x):[...w.slots,x];else{w[k]=x;if(k=='subj')w.topic=null}render()}

function propMut(){S.rel={pid:3,st:'sent'};notif('🔵','Entraide proposée à Sofia.','mutual');toast('Entraide proposée ✔');setTimeout(()=>{S.rel.st='active';notif('🟢','Sofia a accepté ton entraide.','mutual');render()},3000);render()}
function fav(id){id=+id;S.fav=S.fav.includes(id)?S.fav.filter(x=>x!=id):[...S.fav,id];render()}
function gNew(){S.modal=`<h3>Créer un groupe</h3><input id="gn" aria-label="Nom" placeholder="Nom du groupe"><p><input id="gs" aria-label="Matière" placeholder="Matière (ex. Maths)"></p><p><input id="gm" type="number" value="8" aria-label="Membres max"></p><div class="row"><button class="btn o" onclick="S.modal=null;render()">Annuler</button><button class="btn" onclick="gMake()">Créer</button></div>`;render()}

function gSess(id){const g=G.find(x=>x.id==id);S.sessions.unshift({id:Date.now(),pid:1,subj:g.subj,with:g.n,slot:g.next=='À planifier'?'Jeudi 18h':g.next,d:'2h',fmt:'Visio',st:'accepted',role:'mutual',c:0});notif('📅','Session de groupe ajoutée au calendrier.','calendar');toast('Session créée ✔');go('calendar')}
Object.assign(V,{
home:()=>`<h1>Bonjour Kérian 👋</h1><h2 style="text-align:center;margin:18px 0">Que veux-tu faire ?</h2><div class="grid"><button class="btn big" onclick="go('helpers')">🧑‍🏫 Je veux aider<br><small style="font-weight:500">Partager ce que je maîtrise</small></button><button class="btn big" style="background:var(--okb);color:var(--ok)" onclick="S.w.st=1;go('help')">🎓 Je veux être aidé<br><small style="font-weight:500">Trouver quelqu'un pour m'aider</small></button><button class="btn big" style="background:var(--pl);color:var(--p);border:2px dashed var(--p)" onclick="go('mutual')">🔄 Entraide<br><small style="font-weight:500">Nous nous aidons mutuellement</small></button></div><p class="mu" style="text-align:center">Tu peux changer de mode à tout moment.</p><h2>Demandes reçues</h2>${inc()||'<div class="card empty">Aucune demande en attente.</div>'}<h2>Tes prochaines sessions</h2>${sess(S.sessions.filter(s=>s.st=='accepted').slice(0,2))||'<div class="card empty">Aucune session confirmée.</div>'}<h2>Ta progression</h2><div class="grid g4"><div class="card stat"><b>${S.credits} 🪙</b><span class="mu">crédits</span></div><div class="card stat"><b>Niveau 3</b><span class="mu">Aidant régulier</span></div><div class="card stat"><b>${S.done}</b><span class="mu">sessions</span></div><div class="card stat"><b>4,8 ★</b><span class="mu">moyenne</span></div></div>`,
help(){const w=S.w,st=w.st,ch=(a,k,f)=>`<div class="chips">${a.map(x=>`<button class="chip ${f(x)?'on':''}" onclick="wz('${k}','${x}')">${x}</button>`).join('')}</div>`;let b;
if(st==1)b=`<h2>Matière</h2>${ch(Object.keys(SUBJ),'subj',x=>w.subj==x)}<h2>Sujet</h2>${ch(SUBJ[w.subj],'topic',x=>w.topic==x)}`;
else if(st==2)b=`<h2>Décris ton besoin</h2><textarea rows="3" aria-label="Description" oninput="S.w.desc=this.value" placeholder="Ex. : j'ai du mal avec les équations différentielles.">${w.desc}</textarea><h2>Format</h2>${ch(['Message','Audio','Visio','Groupe'],'fmt',x=>w.fmt==x)}<h2>Durée</h2>${ch(['30 min','1h','1h30','2h'],'dur',x=>w.dur==x)}`;
else b=`<h2>Quand ?</h2><div class="chips"><button class="chip ${w.flex?'on':''}" onclick="S.w.flex=!S.w.flex;render()">Je suis flexible</button></div>${w.flex?'':'<p class="mu">Choisis un ou plusieurs créneaux.</p>'+ch(SLOTS,'slot',x=>w.slots.includes(x))}`;
return `<h1>Je veux être aidé</h1><p class="mu">Étape ${st} sur 3</p><div class="bar"><i style="width:${st*33.3}%"></i></div>${b}<p class="row" style="margin-top:22px">${st>1?B('S.w.st--;render()','Retour',1):''}${B(st<3?'S.w.st++;render()':"go('results')",st<3?'Continuer':'Trouver des profils')}</p>`},
calendar(){const sel=S.cal,cells=[];for(let i=0;i<35;i++){const d=new Date(2026,8,28+i),n=S.sessions.filter(s=>['accepted','waiting','counter','pending'].includes(s.st)&&dayOf(s.slot)==i).length;cells.push(`<button class="chip ${sel==i?'on':''}" style="border-radius:10px;min-height:54px;padding:4px" onclick="S.cal=${i};render()" aria-label="${d.getDate()}/${d.getMonth()+1}, ${n} session(s)">${d.getDate()}<br><span aria-hidden="true">${'●'.repeat(Math.min(n,3))}</span></button>`)}

<script>

(function(){
S.manualSt = ['busy','dnd'].includes(S.meSt) ? S.meSt : 'on';
S.presenceOpen=false; S.autoPresence=null;
const PRES={
 on:['En ligne','presence-on'], busy:['Occupé','presence-busy'], dnd:['Ne pas déranger','presence-dnd'],
 call:['En appel','presence-call'], video:['En visio','presence-video'], session:['En session','presence-session'], off:['Hors ligne','presence-off']
};
function effectivePresence(){
 if(document.hidden) return 'off';
 if(S.autoPresence) return S.autoPresence;
 if(S.call) return S.call.aud?'call':'video';
 return S.manualSt||'on';
}
window.presenceHTML=function(compact=false){const k=effectivePresence(),p=PRES[k];return `<span class="presence-dot ${p[1]}" aria-hidden="true"></span><span class="presence-label">${p[0]}</span>`}

window.togglePresence=function(){S.presenceOpen=!S.presenceOpen;S.showN=false;S.am=false;render()}
window.presenceMenu=function(){if(!S.presenceOpen)return '';return `<div class="card presence-menu"><b>Mon statut</b><p class="mu" style="margin:4px 0 8px">Choisis seulement ton état volontaire.</p>${[['on','En ligne'],['busy','Occupé'],['dnd','Ne pas déranger']].map(x=>`<button class="presence-option" onclick="setManualPresence('${x[0]}')"><span class="presence-dot ${PRES[x[0]][1]}"></span><span class="grow">${x[1]}</span>${S.manualSt===x[0]?'✓':''}</button>`).join('')}<div class="presence-note mu"><b>Automatiques</b><br>Hors ligne quand PEERLY n'est pas actif.<br>En appel, en visio ou en session pendant une activité correspondante.</div></div>`}
// Les activités PEERLY prennent temporairement la priorité sur le choix manuel.
window.setSt=function(on){const s=S.sessions.find(x=>x.id==(S.call||{}).sid),pp=s&&P.find(x=>x.id==s.pid);if(on){S.autoPresence=S.call?(S.call.aud?'call':'video'):'session'}else S.autoPresence=null;if(pp){if(on){pp._o=pp.stt;pp.stt='sess'}else if(pp._o){pp.stt=pp._o;pp._o=null}}render()}

window.nav=function(){const r=route().split('/')[0],un=S.notifs.filter(n=>n.u).length,adm=S.user&&S.user.role!='USER',L=[['home','home','Accueil'],['explore','search','Trouver'],['feed','megaphone','Demandes'],['community','message','Communauté'],['calendar','calendar','Calendrier'],['messages','message','Messages'],['groups','users','Groupes'],['contrib','award','Contributions'],['campus','building','Campus'],['premium','sparkles','Premium']],M=[['profile/me','user','Mon profil'],['reputation','star','Ma réputation'],['progress','target','Ma progression'],['favs','heart','Favoris'],['trust','shield','PEERLY Trust'],['settings','settings','Paramètres'],['support','help','Aide & support'],['about','help','Comment fonctionne PEERLY ?'],...(adm?[['admin','settings','Administration']]:[])],on=l=>r==l[0].split('/')[0]?'on':'',NL=S.notifs.filter(n=>S.nc=='Tout'||nCat(n)==S.nc).slice(0,8);return `<header><a class="logo" href="#/home" aria-label="PEERLY, accueil"><span class="mark">↔</span>PEERLY</a><span class="grow"></span><button class="presence-btn" onclick="togglePresence()" aria-label="Modifier mon statut" aria-expanded="${S.presenceOpen}">${presenceHTML()}</button><button class="btn o" onclick="demoM()" aria-label="Mode démonstration">${PI('play')}</button><button class="bell" onclick="S.showN=!S.showN;S.presenceOpen=false;S.am=false;S.notifs.forEach(n=>n.u=0);render()" aria-label="Notifications">${PI('bell')}${un?`<span class="dot">${un}</span>`:''}</button><button style="background:none;border:0;padding:0" onclick="S.am=!S.am;S.presenceOpen=false;S.showN=false;render()" aria-label="Menu du compte">${av('K',0,38)}</button></header><aside class="side" aria-label="Navigation principale">${L.map(l=>`<a href="#/${l[0]}" class="${on(l)}">${PI(l[1])}${l[2]}</a>`).join('')}<button class="btn o" onclick="demoM()">${PI('play')} Mode démonstration</button></aside>${presenceMenu()}${S.am?`<div class="card" style="position:fixed;right:16px;top:64px;z-index:30;width:min(320px,92vw)">${M.map(l=>`<a class="row" style="padding:10px;text-decoration:none" href="#/${l[0]}" onclick="S.am=false">${PI(l[1])}<span>${l[2]}</span></a>`).join('')}<button class="btn o" onclick="outM()">${PI('logout')} Se déconnecter</button></div>`:''}${S.showN?`<div class="card" style="position:fixed;right:16px;top:64px;z-index:29;width:min(380px,92vw)"><h3>Notifications</h3>${NL.map(n=>`<p class="row"><span>${n.t}</span></p>`).join('')||'<p class="mu">Aucune notification.</p>'}</div>`:''}<nav class="tabbar" aria-label="Navigation mobile">${[['home','home','Accueil'],['explore','search','Trouver'],['feed','megaphone','Demandes'],['messages','message','Messages'],['campus','building','Campus']].map(l=>`<a href="#/${l[0]}" class="${on(l)}">${PI(l[1])}<small>${l[2]}</small></a>`).join('')}</nav>`};

<script>

(function(){

const profileBeforeContributionFix=V.profile;

window.setContribView=function(v){S.contribView=v;render()};
V.contrib=function(){
  const sb=S.cs||'Général';
  const subs=['Général','Maths','Anglais','Python','Réseaux','Physique','Histoire'];
  const eligible=P.filter(p=>!S.blocked.includes(p.id)&&p.vis&&(sb==='Général'||(p.skills[sb]||0)>=3));
  const filtered=eligible.filter(p=>p.name.toLowerCase().includes((S.cq||'').toLowerCase()));
  const ranked=[...filtered].sort((a,b)=>rec(b,sb)-rec(a,sb));
  const switcher=`<div class="contrib-switch"><button class="btn ${S.contribView==='recommended'?'':'o'}" onclick="setContribView('recommended')">${PI('award')} Recommandés</button><button class="btn ${S.contribView==='ranking'?'':'o'}" onclick="setContribView('ranking')">${PI('users')} Classements</button></div>`;
  const filters=`<input aria-label="Rechercher un contributeur" placeholder="Rechercher un contributeur" value="${S.cq||''}" oninput="S.cq=this.value;render()"><div class="chips" style="margin:10px 0">${subs.map(x=>`<button class="chip ${sb===x?'on':''}" onclick="S.cs='${x}';render()">${x}</button>`).join('')}</div>`;
  if(S.contribView==='ranking'){
    const rows=ranked.map((p,i)=>{const c=CT[p.id],topic=sb==='Général'?(Object.keys(p.skills)[0]||'Général'):sb;return `<tr><td class="rank-num">#${i+1}</td><td><div class="rank-user">${av(p.name,p.id,38)}<div><b>${p.name}</b><div class="mu">${topic} · ${p.grade}</div></div></div></td><td>${c.h} aides · ${c.hon}% honorées</td><td class="quality-pill">★ ${p.rating}</td><td><button class="btn o" onclick="go('profile/${p.id}')">Voir le profil</button></td></tr>`}).join('');
    return `<h1>${PI('award')} Contributions</h1><p class="mu">Découvre les membres particulièrement investis, globalement ou par matière.</p>${switcher}<div class="card contrib-note"><b>Un repère de contribution, pas une compétition.</b><p class="mu">Le classement aide à découvrir des contributeurs reconnus. Le rang ne donne aucun avantage, aucune récompense et n'est pas affiché sur les profils. L'ordre combine plusieurs signaux de qualité et de fiabilité ; il ne dépend pas uniquement du volume d'aide.</p></div>${filters}<div class="card x" style="margin-top:12px">${rows?`<table class="rank-table"><thead><tr><th>Rang</th><th>Contributeur</th><th>Engagement</th><th>Qualité</th><th></th></tr></thead><tbody>${rows}</tbody></table>`:`<div class="empty">Aucun contributeur pour ces critères.</div>`}</div>`;
  }
  return `<h1>${PI('award')} Contributions</h1><p class="mu">PEERLY ne récompense pas celui qui aide le plus : il valorise celui qui aide bien. Trouve des personnes reconnues pour la qualité de leur aide. <a href="#/progress" style="color:var(--p)">Ma progression</a></p>${switcher}${filters}<div class="grid">${ranked.map(p=>cc(p,sb)).join('')||`<div class="card empty">Aucun contributeur en ${sb} pour l'instant.<br>${B("go('community')",'Poser la question à la communauté')}</div>`}</div><h2>Distinctions du mois</h2><div class="card">Contributeur Mathématiques — Octobre : Emma · Contribution Communauté — Octobre : Lucas<div class="mu">Reconnaissance symbolique et qualitative, sans récompense liée au rang.</div></div>`;
};
render();
})();
</script>
</body></html>
